<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ты меня любишь?</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            min-height: 100vh; background-color: #000;
            display: flex; justify-content: center; align-items: center;
            color: #fff; overflow: hidden;
        }
        .container {
            display: flex; flex-direction: column; align-items: center;
            gap: 20px; width: 100%; max-width: 400px; padding: 20px;
        }
        h1 { font-size: 2rem; font-weight: bold; text-align: center; }
        input {
            width: 100%; padding: 15px; font-size: 1.2rem;
            background: #000; border: 2px solid #fff; color: #fff;
            outline: none; text-align: center;
        }
        button {
            width: 100%; padding: 15px; font-size: 1.2rem;
            font-weight: bold; background: #fff; color: #000;
            border: none; cursor: pointer; text-transform: uppercase;
        }

        /* Экран со скримером */
        #jumpscare {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #000; z-index: 9999; display: none;
            justify-content: center; align-items: center;
        }
        #jumpscare img {
            width: 100%; height: 100%; object-fit: cover;
        }

        /* Анимация резкого появления и тряски */
        .show-scary { display: flex !important; }
        .show-scary img {
            animation: scaryAppear 0.1s forwards, scaryShake 0.05s infinite;
        }
        @keyframes scaryAppear {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes scaryShake {
            0% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(5px, 5px) scale(1.02); }
            50% { transform: translate(-5px, 0) scale(1); }
            75% { transform: translate(0, -5px) scale(1.02); }
            100% { transform: translate(0, 0) scale(1); }
        }
    </style>
</head>
<body>

    <div class="container" id="startScreen">
        <h1>ты меня любишь?</h1>
        <input type="text" id="loveInput" placeholder="...">
        <button id="sendBtn">Отправить</button>
    </div>

    <!-- Ссылка на картинку, которая лежит в репозитории -->
    <div id="jumpscare">
        <img src="monster.jpg" alt="scary">
    </div>

    <script>
        const sendBtn = document.getElementById('sendBtn');
        const startScreen = document.getElementById('startScreen');
        const jumpscare = document.getElementById('jumpscare');

        function playScarySound() {
            // Голос "I see you"
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance("I see you");
                utterance.lang = 'en-US';
                utterance.rate = 0.6; 
                utterance.pitch = 0.1; 
                utterance.volume = 1;
                window.speechSynthesis.speak(utterance);
            }

            // Скрежет
            setTimeout(() => {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(800, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 1.5);
                    gain.gain.setValueAtTime(0.5, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.5);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 1.5);
                } catch(e) {}
            }, 1500);
        }

        sendBtn.addEventListener('click', () => {
            startScreen.style.display = 'none';
            jumpscare.classList.add('show-scary');
            playScarySound();
            if (navigator.vibrate) navigator.vibrate([500, 200, 500, 200, 1000]);
        });
    </script>
</body>
</html>
