<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ты меня любишь?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Arial', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s;
            padding: 20px;
        }

        /* Основной контейнер с вопросом */
        .question-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 48px 56px;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            max-width: 600px;
            width: 100%;
            transition: all 0.4s ease;
        }

        h1 {
            font-size: 3rem;
            font-weight: 600;
            color: #ffb7c5;
            text-shadow: 0 0 20px rgba(255, 105, 180, 0.8), 0 0 40px rgba(255, 0, 100, 0.4);
            letter-spacing: 2px;
            margin-bottom: 32px;
            transition: all 0.3s;
            word-break: break-word;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 28px;
        }

        input[type="text"] {
            width: 100%;
            padding: 22px 24px;
            font-size: 1.4rem;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 60px;
            color: white;
            outline: none;
            transition: all 0.3s;
            text-align: center;
            letter-spacing: 1px;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 25px rgba(255, 182, 193, 0.3), inset 0 0 15px rgba(255, 255, 255, 0.05);
        }

        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.6);
            font-style: italic;
            font-size: 1.2rem;
        }

        input[type="text"]:focus {
            border-color: #ff9eb5;
            box-shadow: 0 0 35px #ff9eb5, inset 0 0 20px rgba(255, 182, 193, 0.3);
            background: rgba(255, 255, 255, 0.15);
        }

        button {
            background: linear-gradient(135deg, #ff6b9d, #c44569);
            border: none;
            padding: 20px 50px;
            font-size: 1.6rem;
            font-weight: 700;
            color: white;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.5), 0 0 30px #ff6b9d;
            letter-spacing: 2px;
            transition: all 0.2s ease;
            text-transform: uppercase;
            border: 1px solid rgba(255, 255, 255, 0.4);
            width: 100%;
            max-width: 320px;
            margin: 0 auto;
            display: block;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.6), 0 0 50px #ff6b9d;
            background: linear-gradient(135deg, #ff85af, #d65b7f);
        }

        button:active {
            transform: scale(0.98);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.6), 0 0 30px #ff6b9d;
        }

        /* Черный экран / вирусная имитация */
        .virus-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 9999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            text-align: center;
            overflow: hidden;
        }

        .virus-screen.active {
            display: flex;
        }

        .virus-text {
            font-size: 1.8rem;
            margin: 10px 0;
            text-shadow: 0 0 15px #00ff41, 0 0 30px #00aa00;
            letter-spacing: 3px;
            animation: glitch 0.3s infinite alternate;
            max-width: 90%;
            word-break: break-word;
        }

        .virus-sub {
            font-size: 1.2rem;
            color: #ff3333;
            text-shadow: 0 0 20px red, 0 0 40px darkred;
            margin: 15px 0;
            animation: pulse 0.5s infinite alternate;
            letter-spacing: 2px;
        }

        .skull {
            font-size: 6rem;
            filter: drop-shadow(0 0 30px #ff0000);
            margin-bottom: 20px;
            animation: shake 0.4s infinite;
        }

        .binary {
            font-size: 1rem;
            color: #00cc00;
            opacity: 0.6;
            letter-spacing: 8px;
            margin-top: 30px;
            word-break: break-all;
            max-width: 100%;
            line-height: 1.6;
            animation: flicker 0.2s infinite;
        }

        .progress-bar {
            width: 80%;
            max-width: 500px;
            height: 20px;
            background: #111;
            border: 2px solid #00ff41;
            border-radius: 30px;
            margin: 20px 0;
            overflow: hidden;
            box-shadow: 0 0 30px #00ff41;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00ff41, #00aa00, #00ff41);
            animation: loading 8s linear forwards;
        }

        @keyframes glitch {
            0% { transform: translate(0); opacity: 1; }
            20% { transform: translate(-3px, 2px); opacity: 0.9; }
            40% { transform: translate(3px, -2px); opacity: 1; }
            60% { transform: translate(-2px, -1px); opacity: 0.95; }
            80% { transform: translate(2px, 1px); opacity: 0.9; }
            100% { transform: translate(0); opacity: 1; }
        }

        @keyframes pulse {
            0% { opacity: 0.7; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.03); }
        }

        @keyframes shake {
            0% { transform: rotate(0deg) translate(0, 0); }
            25% { transform: rotate(2deg) translate(2px, -2px); }
            50% { transform: rotate(-2deg) translate(-2px, 2px); }
            75% { transform: rotate(1deg) translate(1px, 1px); }
            100% { transform: rotate(0deg) translate(0, 0); }
        }

        @keyframes flicker {
            0% { opacity: 0.5; }
            50% { opacity: 0.8; }
            100% { opacity: 0.5; }
        }

        @keyframes loading {
            0% { width: 0%; }
            20% { width: 18%; }
            40% { width: 37%; }
            60% { width: 59%; }
            80% { width: 82%; }
            100% { width: 100%; }
        }

        /* Скрываем основной контейнер, когда активен вирус */
        .virus-active .question-container {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Основной интерфейс -->
    <div class="question-container" id="questionContainer">
        <h1>ты меня любишь?</h1>
        <div class="input-wrapper">
            <input type="text" id="loveInput" placeholder="напиши что-нибудь..." autocomplete="off" spellcheck="false">
        </div>
        <button id="sendBtn">отправить</button>
    </div>

    <!-- Черный экран / вирус -->
    <div class="virus-screen" id="virusScreen">
        <div class="skull">💀</div>
        <div class="virus-text">ВНИМАНИЕ! ВИРУС!</div>
        <div class="virus-sub">СИСТЕМА ЗАРАЖЕНА</div>
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        <div class="virus-text" style="font-size:1.2rem; color:#ff5555;">ФАЙЛЫ ШИФРУЮТСЯ...</div>
        <div class="binary" id="binaryText">01001000 01000101 01001100 01010000 00100000 01001101 01000101</div>
        <div class="virus-sub" style="color:#ffaa00; font-size:1rem; margin-top:20px;">НЕ ВЫКЛЮЧАЙТЕ КОМПЬЮТЕР</div>
    </div>

    <script>
        (function() {
            const sendBtn = document.getElementById('sendBtn');
            const loveInput = document.getElementById('loveInput');
            const virusScreen = document.getElementById('virusScreen');
            const binaryText = document.getElementById('binaryText');
            const body = document.body;

            // Генерация случайной бинарной строки для эффекта
            function generateBinary(length = 60) {
                let result = '';
                for (let i = 0; i < length; i++) {
                    result += Math.round(Math.random()) ? '1' : '0';
                    if (i % 8 === 7 && i !== length - 1) result += ' ';
                }
                return result;
            }

            // Обновление бинарного текста каждые 100 мс для пугающего эффекта
            let binaryInterval = null;
            function startBinaryFlicker() {
                if (binaryInterval) clearInterval(binaryInterval);
                binaryInterval = setInterval(() => {
                    binaryText.textContent = generateBinary(80);
                }, 90);
            }

            function stopBinaryFlicker() {
                if (binaryInterval) {
                    clearInterval(binaryInterval);
                    binaryInterval = null;
                }
            }

            // Показ вирусного экрана
            function showVirus() {
                // Активируем черный экран
                virusScreen.classList.add('active');
                body.classList.add('virus-active'); // скрывает основной контейнер (на случай если что-то осталось)

                // Запускаем мерцание бинарного кода
                startBinaryFlicker();

                // Меняем заголовок страницы (для пущего эффекта)
                document.title = '⚠️ ВИРУС ⚠️';

                // Через 2 секунды добавим ещё один "пугающий" элемент — вибрацию (если поддерживается)
                setTimeout(() => {
                    if (navigator.vibrate) {
                        navigator.vibrate([200, 100, 200, 100, 500]);
                    }
                }, 1000);

                // Дополнительный звуковой эффект через Web Audio API (имитация помех)
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        const audioCtx = new AudioContext();
                        const oscillator = audioCtx.createOscillator();
                        const gainNode = audioCtx.createGain();

                        oscillator.type = 'sawtooth';
                        oscillator.frequency.value = 80;
                        gainNode.gain.value = 0.08;

                        oscillator.connect(gainNode);
                        gainNode.connect(audioCtx.destination);
                        oscillator.start();

                        // Плавное затухание через 5 секунд
                        setTimeout(() => {
                            try {
                                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 3);
                                setTimeout(() => {
                                    oscillator.stop();
                                    audioCtx.close();
                                }, 3000);
                            } catch (e) { /* игнорируем */ }
                        }, 4000);
                    }
                } catch (e) {
                    // Автовоспроизведение может быть заблокировано — ничего страшного
                }
            }

            // Обработчик клика по кнопке "отправить"
            sendBtn.addEventListener('click', function(e) {
                e.preventDefault();

                // Проверяем, заполнено ли поле (не пустое после обрезки пробелов)
                const inputValue = loveInput.value.trim();
                if (inputValue === '') {
                    // Если поле пустое, можно слегка "пригрозить" — но по заданию нужно только при заполненном.
                    // Добавим лёгкую вибрацию поля для UX.
                    loveInput.style.borderColor = '#ff4d4d';
                    loveInput.style.boxShadow = '0 0 30px #ff4d4d';
                    setTimeout(() => {
                        loveInput.style.borderColor = '';
                        loveInput.style.boxShadow = '';
                    }, 600);
                    return;
                }

                // Показываем вирусный экран
                showVirus();
            });

            // Также можно обработать нажатие Enter в поле ввода (для удобства)
            loveInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendBtn.click();
                }
            });

            // Сброс стилей поля при вводе (чтобы убрать красную рамку)
            loveInput.addEventListener('input', function() {
                loveInput.style.borderColor = '';
                loveInput.style.boxShadow = '';
            });
        })();
    </script>
</body>
</html>
